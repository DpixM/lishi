<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lishi Tool Finder</title>
  <link rel="manifest" href="manifest.webmanifest">
</head>
<body>
  <h1>🔑 Lishi Tool Finder</h1>

  <p>Importe la base de données :</p>
  <button onclick="document.getElementById('fileInput').click()">Choisir un fichier</button>
  <input type="file" id="fileInput" style="display:none" accept=".json">

  <br><br>
  <!-- 🚀 Nouveau bouton -->
  <button onclick="importFromGitHub()">Importer depuis GitHub</button>

  <p id="status"></p>

  <script>
    const fileInput = document.getElementById('fileInput');
    const status = document.getElementById('status');

    // Import local JSON
    fileInput.addEventListener('change', async (event) => {
      const file = event.target.files[0];
      if (file) {
        const text = await file.text();
        try {
          const json = JSON.parse(text);
          localStorage.setItem("lishiData", JSON.stringify(json));
          status.innerText = "✅ JSON importé (" + Object.keys(json).length + " entrées)";
        } catch (e) {
          status.innerText = "❌ Erreur : fichier invalide";
        }
      }
    });

    // Import depuis GitHub
    async function importFromGitHub() {
      const url = "https://raw.githubusercontent.com/DpixM/lishi/main/lishi_db_expanded.json";
      try {
        const response = await fetch(url);
        if (!response.ok) throw new Error("Impossible de charger le fichier");
        const data = await response.json();
        localStorage.setItem("lishiData", JSON.stringify(data));
        status.innerText = "✅ Données importées depuis GitHub (" + Object.keys(data).length + " entrées)";
      } catch (error) {
        status.innerText = "❌ Erreur : " + error.message;
      }
    }
  </script>
</body>
</html>
