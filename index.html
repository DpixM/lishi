<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lishi ↔ Serrures (offline)</title>
  <link rel="manifest" href="manifest.webmanifest">
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    th { background: #f4f4f4; }
    input, select, button { margin: 5px; padding: 5px; }
    .error { color: red; }
  </style>
</head>
<body>
  <h1>🔑 Lishi ↔ Serrures (offline)</h1>
  <p>Recherche par <b>code Lishi</b> (HU66, YALE-5...) ou par <b>marque/modèle</b> (VW Golf, Yale 6…). Tout reste local.</p>

  <input type="text" id="search" placeholder="Ex: HU66 ou Yale 5 ou VW Polo">
  <button onclick="search()">Chercher</button>
  <button onclick="showAll()">Tout afficher</button>
  <br>

  Filtrer :
  <select id="filter" onchange="applyFilter()">
    <option value="all">(tous types)</option>
    <option value="auto">Automobile</option>
    <option value="euro_cylinder">Cylindre européen</option>
    <option value="residential">Résidentiel</option>
  </select>

  <br><br>

  <button onclick="importFile()">📂 Parcourir...</button>
  <button onclick="importGitHub()">📥 Importer depuis GitHub</button>
  <button onclick="exportJSON()">Exporter JSON</button>
  <button onclick="exportCSV()">Exporter CSV</button>
  <button onclick="resetDB()">Reset base locale</button>

  <p><b>Total entrées importées :</b> <span id="count">0</span></p>
  <p id="error" class="error"></p>

  <table id="results">
    <thead>
      <tr>
        <th>Code Lishi</th>
        <th>Keyway / Code</th>
        <th>Type</th>
        <th>Compatibilités</th>
        <th>Notes</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

<script>
let db = [];

// 🔎 Chercher
function search() {
  const q = document.getElementById("search").value.toLowerCase();
  const filtered = db.filter(row =>
    Object.values(row).some(v => v.toLowerCase().includes(q))
  );
  render(filtered);
}

// 📋 Tout afficher
function showAll() { render(db); }

// 🔽 Filtrer par type
function applyFilter() {
  const type = document.getElementById("filter").value;
  if (type === "all") render(db);
  else render(db.filter(r => r.type === type));
}

// 📂 Importer depuis fichier
function importFile() {
  const input = document.createElement("input");
  input.type = "file";
  input.accept = ".json,.csv";
  input.onchange = e => {
    const file = e.target.files[0];
    const reader = new FileReader();
    reader.onload = ev => {
      if (file.name.endsWith(".json")) {
        db = JSON.parse(ev.target.result);
      } else {
        db = parseCSV(ev.target.result);
      }
      saveDB();
      render(db);
    };
    reader.readAsText(file);
  };
  input.click();
}

// 📥 Importer depuis GitHub
async function importGitHub() {
  try {
    const res = await fetch("lishi_db_full_seed.json");
    if (!res.ok) throw new Error("Fichier introuvable");
    db = await res.json();
    saveDB();
    render(db);
  } catch (err) {
    document.getElementById("error").innerText = "❌ Échec import GitHub : " + err.message;
  }
}

// 💾 Sauvegarde locale
function saveDB() {
  localStorage.setItem("lishi_db", JSON.stringify(db));
}

// 📤 Export JSON
function exportJSON() {
  const blob = new Blob([JSON.stringify(db, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "lishi_export.json"; a.click();
}

// 📤 Export CSV
function exportCSV() {
  let csv = "Code Lishi,Keyway,Type,Compatibilités,Notes\n";
  db.forEach(r => {
    csv += `"${r.code}","${r.keyway}","${r.type}","${r.compat}","${r.notes}"\n`;
  });
  const blob = new Blob([csv], { type: "text/csv" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "lishi_export.csv"; a.click();
}

// ♻ Reset DB
function resetDB() {
  localStorage.removeItem("lishi_db");
  db = [];
  render(db);
}

// 🖼️ Affichage tableau
function render(data) {
  const tbody = document.querySelector("#results tbody");
  tbody.innerHTML = "";
  data.forEach(r => {
    const tr = document.createElement("tr");
    tr.innerHTML = `<td>${r.code}</td><td>${r.keyway}</td><td>${r.type}</td><td>${r.compat}</td><td>${r.notes}</td>`;
    tbody.appendChild(tr);
  });
  document.getElementById("count").innerText = data.length;
}

// CSV ➝ JSON
function parseCSV(text) {
  const rows = text.split("\n").map(r => r.split(","));
  const headers = rows.shift();
  return rows.filter(r => r.length > 1).map(r => ({
    code: r[0], keyway: r[1], type: r[2], compat: r[3], notes: r[4]
  }));
}

// 🔄 Charger base locale au démarrage
window.onload = () => {
  const saved = localStorage.getItem("lishi_db");
  if (saved) {
    db = JSON.parse(saved);
    render(db);
  }
};
</script>
</body>
</html>
