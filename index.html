<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Lishi ↔ Serrures (offline)</title>
  <link rel="manifest" href="manifest.webmanifest">
  <style>
    body{font-family:system-ui,Segoe UI,Roboto,Arial;margin:16px;color:#111}
    h1{margin:0 0 8px;font-size:26px}
    .small{color:#666;font-size:13px;margin-bottom:10px}
    .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
    input,select,button{padding:8px;font-size:14px}
    button{border-radius:6px;border:1px solid #ccc;background:#f7f7f7;cursor:pointer}
    .primary{background:#0a7;color:#fff;border-color:#0a7}
    table{width:100%;border-collapse:collapse;margin-top:10px}
    th,td{border:1px solid #ddd;padding:8px;text-align:left;font-size:14px}
    th{background:#f6f6f6}
    #status{margin-top:6px;color:#444;font-size:13px}
    .error{color:#c00}
  </style>
</head>
<body>
  <h1>Lishi ↔ Serrures (offline)</h1>
  <div class="small">Recherche par <b>code Lishi</b> (HU66, YALE-5…) ou par <b>marque/modèle</b>. Tout reste local.</div>

  <div class="row">
    <input id="q" placeholder="Ex: HU66 ou Yale 5 ou VW Polo" style="flex:1;min-width:220px">
    <button class="primary" onclick="doSearch()">Chercher</button>
    <button onclick="resetView()">Tout afficher</button>

    <label for="typeFilter">Filtrer :</label>
    <select id="typeFilter" onchange="doSearch()">
      <option value="">(tous)</option>
      <option value="auto">auto</option>
      <option value="euro_cylinder">euro_cylinder</option>
      <option value="residential">residential</option>
      <option value="motorbike">motorbike</option>
      <option value="dimple">dimple</option>
      <option value="special">special</option>
    </select>

    <input id="fileIn" type="file" accept=".json,.csv" style="display:none">
    <button onclick="document.getElementById('fileIn').click()">Parcourir…</button>
    <button class="primary" onclick="importFromGitHub()">Importer depuis GitHub</button>
  </div>

  <div id="status">Base locale : <span id="count">0</span> entrées.</div>
  <p id="err" class="error"></p>

  <table id="results" aria-live="polite">
    <thead>
      <tr>
        <th>Code Lishi</th>
        <th>Keyway/Code</th>
        <th>Type</th>
        <th>Compatibilités</th>
        <th>Notes</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

<script>
document.addEventListener("DOMContentLoaded", () => {
  /* --- CONFIG --- */
  const repoRawUrl = "https://raw.githubusercontent.com/DpixM/lishi/main/lishi_db_eu_plus.json";

  /* --- STATE --- */
  let db = [];
  const storageKey = "lishiData_v1";

  /* --- HELPERS --- */
  const setStatus = msg => document.getElementById("status").innerText = msg;
  const setError  = msg => document.getElementById("err").innerText = msg || "";
  function updateCount(){
    const el = document.getElementById("count");
    if (el) el.innerText = db.length || 0;
  }
  function saveLocal(){ localStorage.setItem(storageKey, JSON.stringify(db)); updateCount(); }
  function loadLocal(){ try{ const s=localStorage.getItem(storageKey); db=s?JSON.parse(s):[]; }catch(e){ db=[]; } updateCount(); }

  function escapeHTML(s){ return String(s||"").replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"}[c])); }
  function render(list){
    const tb = document.querySelector("#results tbody");
    tb.innerHTML = "";
    if(!list.length){ tb.innerHTML = `<tr><td colspan="5" style="color:#666">Aucun résultat</td></tr>`; return; }
    for(const r of list){
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${escapeHTML(r.lishi||r.code||"")}</td>
        <td>${escapeHTML(r.keyway||"")}</td>
        <td>${escapeHTML(r.type||"")}</td>
        <td>${escapeHTML(r.compat||"")}</td>
        <td>${escapeHTML(r.notes||"")}</td>`;
      tb.appendChild(tr);
    }
  }

  /* --- SEARCH / FILTER --- */
  window.doSearch = function(){
    const q = (document.getElementById("q").value||"").toLowerCase().trim();
    const t = document.getElementById("typeFilter").value;
    const res = db.filter(x=>{
      if(t && x.type !== t) return false;
      if(!q) return true;
      return [x.lishi,x.keyway,x.compat,x.notes].some(v => (v||"").toLowerCase().includes(q));
    });
    render(res);
  }
  window.resetView = function(){ document.getElementById("q").value=""; document.getElementById("typeFilter").value=""; render(db); }

  /* --- IMPORT FICHIER --- */
  document.getElementById("fileIn").addEventListener("change", async ev=>{
    const f = ev.target.files[0]; if(!f) return;
    const txt = await f.text();
    try{
      if(f.name.toLowerCase().endsWith(".json")){
        const arr = JSON.parse(txt); if(!Array.isArray(arr)) throw new Error("JSON attendu = tableau d’objets");
        db = arr;
      } else {
        const lines = txt.split(/\r?\n/).filter(Boolean);
        const header = lines.shift().split(/[,;]+/).map(s=>s.trim().toLowerCase());
        db = lines.map(L=>{
          const cols = L.split(/[,;]+/).map(s=>s.trim()); const o={};
          header.forEach((h,i)=>o[h]=cols[i]||""); return o;
        });
      }
      saveLocal(); setError(""); setStatus("Import fichier OK ("+db.length+" entrées)"); render(db);
    }catch(e){ setError("❌ Erreur import fichier : "+e.message); }
  });

  /* --- IMPORT DEPUIS GITHUB --- */
  window.importFromGitHub = async function(){
    setError(""); setStatus("Téléchargement depuis GitHub…");
    try{
      const r = await fetch(repoRawUrl, {cache:"no-store"});
      if(!r.ok) throw new Error("HTTP "+r.status);
      const arr = await r.json();
      if(!Array.isArray(arr)) throw new Error("Format non valide");
      db = arr; saveLocal(); setStatus("✅ Importé depuis GitHub ("+db.length+" entrées)"); render(db);
    }catch(e){ setError("❌ Échec import GitHub : "+e.message); setStatus("Base locale : "+(db.length||0)+" entrées."); }
  }

  /* --- INIT --- */
  loadLocal();
  render(db);
  document.getElementById("q").addEventListener("keydown",e=>{ if(e.key==="Enter") doSearch(); });
});
</script>
</body>
</html>
